name: Build GBA ROM

on:
  push:
  workflow_dispatch:      # lets you press "Run workflow" manually

permissions:
  contents: write         # needed to publish the ROM as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 python-is-python3 zip

      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Download Butano (GBA engine)
        run: |
          git clone --depth 1 https://github.com/GValiente/butano.git /butano
          echo "Butano commit: $(git -C /butano rev-parse HEAD)"

      - name: Assemble project inside Butano
        run: |
          cp -r /butano/template /butano/kanjo_racer
          rm -rf /butano/kanjo_racer/src /butano/kanjo_racer/graphics
          # Butano's built-in fonts live in /butano/common - copy them into the project
          P=/butano/kanjo_racer
          mkdir -p $P/include $P/src $P/graphics
          if [ -d /butano/common ]; then
            [ -d /butano/common/include ]  && cp -r /butano/common/include/.  $P/include/
            [ -d /butano/common/src ]      && cp -r /butano/common/src/.      $P/src/
            [ -d /butano/common/graphics ] && cp -r /butano/common/graphics/. $P/graphics/
            true
          else
            echo "No /butano/common folder; font files found elsewhere:"
            find /butano -iname 'common_*font*' | head
          fi
          # our own files go in last so they win any name clash
          cp -r src/. $P/src/
          cp -r graphics/. $P/graphics/
          sed -i 's/^ROMTITLE.*/ROMTITLE := KANJO RACER/' /butano/kanjo_racer/Makefile
          sed -i 's/^TARGET.*/TARGET := kanjo_racer/' /butano/kanjo_racer/Makefile

      - name: Build ROM
        working-directory: /butano/kanjo_racer
        run: |
          set -o pipefail
          make -j1 2>&1 | tee /build.log

      - name: Show build log (only runs if the build failed)
        if: failure()
        run: |
          {
            echo "## Build log - copy EVERYTHING inside this box and send it back"
            echo '```'
            head -c 7000 /build.log
            echo
            echo "---- Makefile settings ----"
            grep -nE '^(TARGET|ROMTITLE|LIBBUTANO|SOURCES|INCLUDES|GRAPHICS|AUDIO|USER[A-Z]*|PYTHON)' /butano/kanjo_racer/Makefile || true
            echo "---- project folder ----"
            ls /butano/kanjo_racer 2>&1 | head -20
            echo "---- common/include ----"
            ls /butano/common/include 2>&1 | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          head -c 7000 /build.log

      - name: Save full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: /build.log
          if-no-files-found: ignore

      - name: Collect ROM
        run: |
          mkdir -p out
          cp /butano/kanjo_racer/kanjo_racer.gba out/
          ls -la out

      - name: Save ROM as downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanjo_racer_rom
          path: out/kanjo_racer.gba

      - name: Publish ROM as a Release (direct download link)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kanjo Racer - Bear Products (latest build)
          files: out/kanjo_racer.gba
    
